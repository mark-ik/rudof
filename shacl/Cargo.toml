[package]
name = 'shacl'
version.workspace = true
readme = "README.md"
authors.workspace = true
description = "A SHACL validator for RDF data, implemented in Rust."
documentation = "https://docs.rs/shacl"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["sparql"]
# `sh:sparql` constraints and the SPARQL engine, over any store that implements
# `rudof_rdf`'s `QueryRDF`; brings no SPARQL implementation of its own.
sparql-constraints = []
sparql = ["sparql-constraints", "dep:sparql_service", "sparql_service/sparql", "rudof_rdf/sparql"]

[dependencies]
anyhow.workspace = true
either.workspace = true
indoc.workspace = true
petgraph.workspace = true
prefixmap.workspace = true
rayon.workspace = true
rudof_rdf.workspace = true
rudof_rdf_sink.workspace = true
rudof_config.workspace = true
oxrdf.workspace = true
rudof_iri.workspace = true
rudof_typing.workspace = true
rust_decimal.workspace = true
schemars.workspace = true
serde.workspace = true
sparql_service = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker.workspace = true

[dev-dependencies]
oxrdf = { workspace = true, features = ["oxsdatatypes"] }

[[example]]
name = "endpoint_validation"
required-features = ["sparql"]

[[test]]
name = "shacl_testsuite"
required-features = ["sparql"]

[[test]]
name = "read_sink"
required-features = ["sparql"]
